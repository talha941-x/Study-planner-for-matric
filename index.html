<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matric Study Planner</title>

<link rel="manifest" href="manifest.json">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
}

header{
background:#1e293b;
padding:20px;
text-align:center;
box-shadow:0 2px 10px rgba(0,0,0,.4);
}

.container{
width:95%;
max-width:1200px;
margin:auto;
padding:20px;
}

.card{
background:#1e293b;
border-radius:15px;
padding:20px;
margin-bottom:20px;
box-shadow:0 5px 15px rgba(0,0,0,.4);
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

button{
background:#2563eb;
color:white;
border:none;
padding:10px 20px;
border-radius:10px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

input{
width:100%;
padding:10px;
margin-top:10px;
border-radius:10px;
border:none;
background:#334155;
color:white;
}

.progress{
height:15px;
background:#334155;
border-radius:10px;
overflow:hidden;
margin-top:10px;
}

.progress-bar{
height:100%;
width:0%;
background:#22c55e;
transition:.4s;
}
</style>
</head>

<body>

<header>
<h1>📚 Matric Study Planner</h1>
<p>Your complete offline study planner</p>
</header>

<div class="container">

<div class="grid">

<div class="card">
<h2>Exam Countdown</h2>
<h1 id="countdown">Loading...</h1>
</div>

<div class="card">
<h2>Overall Progress</h2>

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<h3 id="progressText">0%</h3>

</div>

</div>

<div class="card">

<h2>Add Subject</h2>

<input
id="subjectInput"
placeholder="Enter subject">

<button onclick="addSubject()">
Add Subject
</button>

</div>

<div
id="subjects">
</div>

</div>

<script>

let subjects=
JSON.parse(
localStorage.getItem("subjects")
)||[];

const examDate=
new Date("2026-10-19");

function updateCountdown(){

let now=
new Date();

let diff=
examDate-now;

let days=
Math.ceil(
diff/86400000
);

document.getElementById(
"countdown"
).innerHTML=
days+" Days";

}

setInterval(
updateCountdown,
1000
);

updateCountdown();

function save(){

localStorage.setItem(
"subjects",
JSON.stringify(subjects)
);

}

function addSubject(){

let input=
document.getElementById(
"subjectInput"
);

if(input.value=="")
return;

subjects.push({

name:input.value,

topics:[]

});

input.value="";

save();

render();

}

function render(){

let html="";

subjects.forEach((s,i)=>{

html+=`
<div class="card">
<h2>${s.name}</h2>

<button onclick="addTopic(${i})">
Add Topic
</button>

<div id="topic${i}">
</div>

</div>
`;

});

document.getElementById(
"subjects"
).innerHTML=html;

}

render();

</script>
